name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA_ID: G-BW55TZPSK3
      PUBLIC_CLARITY_ID: k1u65f5low
      PUBLIC_IUBENDA_SITE_ID: "3966669"
      PUBLIC_IUBENDA_POLICY_ID: "81160121"
      PUBLIC_GOOGLE_SITE_VERIFICATION: JLjm6wIyTtC7Gv_0iXyLSNs_1KhYnHqZtgm2aDtLhR0
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        with:
          node-version: "22"
          build-cmd: npm run build:pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
